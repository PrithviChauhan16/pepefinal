<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPE KUN | Log In & Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }, 
                    colors: { brand: { 900: '#1a1a1a' } } 
                } 
            } 
        }
    </script>

    <style>
        body { 
            background-color: #fff3ff;
            background-image: none; 
            background-repeat: repeat;
            background-size: 300px;
            background-attachment: fixed;
        }

        @media (min-width: 768px) { 
            body { background-size: 500px; } 
        }

        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-12px); } 
            100% { transform: translateY(0px); } 
        }

        .animate-float { 
            animation: float 4s ease-in-out infinite; 
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="text-brand-900 antialiased selection:bg-pink-200 flex items-center justify-center min-h-screen p-4">

    <!-- Floating Auth Card -->
    <div class="bg-white/80 backdrop-blur-md p-8 md:p-10 rounded-[3rem] shadow-2xl border border-white animate-float w-full max-w-md transition-all duration-500">
        
        <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-pink-500 transition-colors mb-6 inline-block">
            ← Back to Shop
        </a>
        
        <!-- Toggle Tabs -->
        <div class="flex bg-gray-100 rounded-full p-1 mb-8">
            <button onclick="toggleForm('login')" id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-full bg-white shadow text-gray-900 transition-all">
                Log In
            </button>

            <button onclick="toggleForm('signup')" id="tab-signup" class="flex-1 py-2 text-sm font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all">
                Sign Up
            </button>
        </div>

        <!-- Log In Form -->
        <form id="form-login" class="space-y-6 block" onsubmit="handleLogin(event)">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-semibold mb-1">Welcome Back</h2>
                <p class="text-gray-500 font-light text-sm">
                    Use admin@pepekun.com / admin123 for dashboard.
                </p>
            </div>

            <input 
                type="email" 
                id="login-email" 
                placeholder="Email Address" 
                class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" 
                required
            >

            <input 
                type="password" 
                id="login-password" 
                placeholder="Password" 
                class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" 
                required
            >

            <button 
                type="submit" 
                class="w-full py-4 bg-brand-900 text-white rounded-full font-medium hover:bg-pink-500 transition-colors shadow-lg">
                Sign In
            </button>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="form-signup" class="space-y-4 hidden" onsubmit="return false;">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-semibold mb-1">Join the Family</h2>
                <p class="text-gray-500 font-light text-sm">
                    Create an account to track your companions.
                </p>
            </div>

            <input 
                type="text" 
                placeholder="Full Name" 
                class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" 
                required
            >

            <input 
                type="email" 
                placeholder="Email Address" 
                class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" 
                required
            >

            <input 
                type="password" 
                placeholder="Create Password" 
                class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" 
                required
            >

            <button 
                type="submit" 
                class="w-full py-4 bg-brand-900 text-white rounded-full font-medium hover:bg-pink-500 transition-colors shadow-lg mt-2">
                Create Account
            </button>
        </form>

    </div>


<script>

const supabaseUrl = 'https://cmxhngjykgoqblobyefh4.supabase.co';

/*
 IMPORTANT:
 Replace the value below with your CURRENT Supabase publishable key.
 It should start with:

 sb_publishable_

Do NOT use the old eyJhbGci... key.
*/
const supabaseKey = 'sb_publishable_05GBhGfDMBLN009-tv5soQ_XkQ_7jPc';


/* 
   Use a unique variable name.
   DO NOT change window.supabase.
*/
const supabaseClient = window.supabase?.createClient(
    supabaseUrl,
    supabaseKey
);


/* =========================
   LOGIN / SIGNUP TABS
   ========================= */

function toggleForm(type) {

    const loginForm = document.getElementById('form-login');
    const signupForm = document.getElementById('form-signup');

    const loginTab = document.getElementById('tab-login');
    const signupTab = document.getElementById('tab-signup');

    loginForm.classList.toggle('hidden', type !== 'login');
    signupForm.classList.toggle('hidden', type !== 'signup');

    loginTab.classList.toggle('bg-white', type === 'login');
    loginTab.classList.toggle('shadow', type === 'login');
    loginTab.classList.toggle('text-gray-900', type === 'login');
    loginTab.classList.toggle('text-gray-500', type !== 'login');

    signupTab.classList.toggle('bg-white', type === 'signup');
    signupTab.classList.toggle('shadow', type === 'signup');
    signupTab.classList.toggle('text-gray-900', type === 'signup');
    signupTab.classList.toggle('text-gray-500', type !== 'signup');
}


/* =========================
   LOCAL CART
   ========================= */

function readLocalCart() {

    try {

        const v = JSON.parse(
            localStorage.getItem('pepekun_cart') || '[]'
        );

        return Array.isArray(v) ? v : [];

    } catch (_) {

        return [];

    }
}


/* =========================
   COMPARE CARTS
   ========================= */

function cartsSame(a, b) {

    const n = x => (x || [])
        .map(i => ({
            id: String(i.id),
            q: Number(i.quantity) || 1
        }))
        .sort((x, y) => x.id.localeCompare(y.id));

    return JSON.stringify(n(a)) === JSON.stringify(n(b));
}


/* =========================
   MERGE GUEST CART
   ========================= */

function mergeGuestCart(saved, local) {

    if (!local.length) {
        return saved || [];
    }

    if (!saved?.length) {
        return local;
    }

    if (cartsSame(saved, local)) {
        return saved;
    }

    const out = (saved || []).map(i => ({
        ...i,
        quantity: Number(i.quantity) || 1
    }));

    for (const item of local) {

        const q = Number(item.quantity) || 1;

        const e = out.find(
            x => String(x.id) === String(item.id)
        );

        if (e) {

            e.quantity += q;

        } else {

            out.push({
                ...item,
                quantity: q
            });

        }
    }

    return out;
}


/* =========================
   PRESERVE GUEST CART
   ========================= */

async function preserveGuestCart(user) {

    if (!user || !supabaseClient) {
        return;
    }

    const local = readLocalCart();

    if (!local.length) {
        return;
    }

    const { data: saved } = await supabaseClient
        .from('carts')
        .select('items')
        .eq('user_id', user.id)
        .maybeSingle();

    const merged = mergeGuestCart(
        Array.isArray(saved?.items) ? saved.items : [],
        local
    );

    const { error } = await supabaseClient
        .from('carts')
        .upsert(
            {
                user_id: user.id,
                items: merged,
                updated_at: new Date().toISOString()
            },
            {
                onConflict: 'user_id'
            }
        );

    if (!error) {

        localStorage.setItem(
            'pepekun_cart',
            JSON.stringify(merged)
        );

    }
}


/* =========================
   LOGIN
   ========================= */

async function handleLogin(event) {

    event.preventDefault();

    if (!supabaseClient) {

        alert(
            'Supabase could not be loaded. Please refresh the page.'
        );

        return;
    }

    const email = document
        .getElementById('login-email')
        .value
        .trim();

    const password = document
        .getElementById('login-password')
        .value;

    const button = event.target.querySelector(
        'button[type="submit"]'
    );

    if (button) {

        button.disabled = true;
        button.textContent = 'Signing In...';

    }


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        if (button) {

            button.disabled = false;
            button.textContent = 'Sign In';

        }

        alert('Login failed: ' + error.message);

        return;
    }


    await preserveGuestCart(data.user);


    window.location.href =
        email.toLowerCase() === 'admin@pepekun.com'
            ? 'admin.html'
            : 'index.html';
}


/* =========================
   SIGN UP
   ========================= */

document.addEventListener(
    'DOMContentLoaded',
    () => {

        const form =
            document.getElementById('form-signup');

        if (!form) {
            return;
        }


        form.addEventListener(
            'submit',
            async event => {

                event.preventDefault();


                if (!supabaseClient) {

                    alert(
                        'Supabase could not be loaded. Please refresh the page.'
                    );

                    return;
                }


                const inputs =
                    form.querySelectorAll('input');


                const fullName =
                    inputs[0].value.trim();

                const email =
                    inputs[1].value.trim();

                const password =
                    inputs[2].value;


                const button =
                    form.querySelector(
                        'button[type="submit"]'
                    );


                if (password.length < 6) {

                    alert(
                        'Password must be at least 6 characters.'
                    );

                    return;
                }


                if (button) {

                    button.disabled = true;
                    button.textContent =
                        'Creating Account...';

                }


                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email,

                        password,

                        options: {

                            data: {
                                full_name: fullName
                            },

                            emailRedirectTo:
                                new URL(
                                    'index.html',
                                    window.location.href
                                ).href
                        }

                    });


                if (button) {

                    button.disabled = false;
                    button.textContent =
                        'Create Account';

                }


                if (error) {

                    alert(
                        'Sign up failed: ' +
                        error.message
                    );

                    return;
                }


                if (data.session) {

                    alert(
                        'Account created successfully!'
                    );

                    window.location.href =
                        'index.html';

                } else {

                    alert(
                        'Account created. Please confirm your email, then log in.'
                    );

                    toggleForm('login');

                }

            }
        );

    }
);


/* =========================
   MAKE INLINE FUNCTIONS
   AVAILABLE
   ========================= */

window.toggleForm = toggleForm;
window.handleLogin = handleLogin;

</script>

</body>
</html>
