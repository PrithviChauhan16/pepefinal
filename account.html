<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPE KUN | My Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 900: '#1a1a1a' } } } } }
    </script>
    <style>
        body { 
            background-color: #fff3ff;
            background-image: url('pepekun-original-bg.png'); 
            background-repeat: repeat;
            background-size: 300px;
            background-attachment: fixed;
        }
        @media (min-width: 768px) { body { background-size: 500px; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 5s ease-in-out infinite; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="text-brand-900 antialiased selection:bg-pink-200">

    <!-- Navbar -->
    <nav class="sticky top-4 z-50 w-[95%] max-w-6xl mx-auto bg-white/60 backdrop-blur-md border border-white/50 px-6 py-4 shadow-md rounded-full flex justify-between items-center">
        <a href="index.html" class="text-sm font-medium hover:text-pink-500 transition-colors">← Back to Shop</a>
        <span class="text-xl font-bold tracking-wide">My Account</span>
        <button onclick="logout()" class="text-sm font-medium text-red-500 hover:text-red-700 transition-colors">Log Out</button>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Column: Profile Details -->
        <div class="md:col-span-1 bg-white/80 backdrop-blur-md p-8 rounded-[2rem] shadow-xl border border-white animate-float h-fit">
            <h2 class="text-2xl font-semibold mb-6">Shipping Details</h2>
            <form id="profile-form" class="space-y-4" onsubmit="saveProfile(event)">
                <div>
                    <label class="block text-sm text-gray-500 mb-1">Full Name</label>
                    <input type="text" id="prof-name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-pink-300 bg-white text-sm" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-500 mb-1">Phone Number</label>
                    <input type="tel" id="prof-phone" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-pink-300 bg-white text-sm" placeholder="+91...">
                </div>
                <div>
                    <label class="block text-sm text-gray-500 mb-1">Delivery Address</label>
                    <textarea id="prof-address" rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-pink-300 bg-white text-sm" placeholder="Full street address..." required></textarea>
                </div>
                <button type="submit" id="save-btn" class="w-full py-3 bg-brand-900 text-white rounded-full font-medium hover:bg-pink-500 transition-colors shadow-md mt-4">
                    Save Details
                </button>
            </form>
        </div>

        <!-- Right Column: Order History -->
        <div class="md:col-span-2 bg-white/80 backdrop-blur-md p-8 rounded-[2rem] shadow-xl border border-white animate-float delay-100">
            <h2 class="text-2xl font-semibold mb-6">Past Orders</h2>
            <div id="orders-container" class="space-y-4">
                <p class="text-gray-500 text-sm">Loading your companions...</p>
            </div>
        </div>

    </main>

    <script>
        // --- 1. Initialize Supabase ---
        const supabaseUrl = 'https://cmxhngjykgoqblobyefh.supabase.co'; 
        const supabaseKey = 'YOUR_ACTUAL_ANON_KEY'; // MUST replace with your real Anon Key
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // --- 2. Check Login State ---
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html'; // Kick out if not logged in
                return;
            }
            currentUser = user;
            loadProfile();
            loadOrders();
        });

        // --- 3. Load & Save Profile ---
        async function loadProfile() {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            
            // If they signed up but don't have a profile row yet, their name might be in the auth metadata
            if (!data) {
                document.getElementById('prof-name').value = currentUser.user_metadata?.full_name || '';
            } else {
                document.getElementById('prof-name').value = data.full_name || '';
                document.getElementById('prof-phone').value = data.phone || '';
                document.getElementById('prof-address').value = data.address || '';
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving...";

            const profileData = {
                id: currentUser.id,
                full_name: document.getElementById('prof-name').value,
                phone: document.getElementById('prof-phone').value,
                address: document.getElementById('prof-address').value
            };

            const { error } = await supabase.from('profiles').upsert(profileData);

            if (error) {
                alert("Failed to save: " + error.message);
            } else {
                btn.innerText = "Saved Successfully!";
                btn.classList.replace('bg-brand-900', 'bg-pink-500');
                setTimeout(() => {
                    btn.innerText = "Save Details";
                    btn.classList.replace('bg-pink-500', 'bg-brand-900');
                }, 2000);
            }
        }

        // --- 4. Load Order History ---
        async function loadOrders() {
            const container = document.getElementById('orders-container');
            
            const { data: orders, error } = await supabase
                .from('orders')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error || !orders || orders.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm bg-white p-4 rounded-xl border border-gray-100">You haven't placed any orders yet.</p>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row justify-between gap-4 transition-all hover:shadow-md">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold px-2 py-1 bg-gray-100 rounded-md text-gray-600">Order #${order.id.toString().slice(0,6).toUpperCase()}</span>
                            <span class="text-xs font-medium px-2 py-1 ${order.status === 'pending' ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'} rounded-md uppercase">${order.status}</span>
                        </div>
                        <p class="text-sm text-gray-500 mb-1">${new Date(order.created_at).toLocaleDateString()}</p>
                        <p class="font-medium text-gray-800 text-sm">${order.items.length} item(s)</p>
                    </div>
                    <div class="md:text-right flex flex-col justify-center">
                        <p class="text-sm text-gray-500 mb-1">Total</p>
                        <p class="text-2xl font-bold text-pink-500">₹${order.order_total}</p>
                    </div>
                </div>
            `).join('');
        }

        // --- 5. Logout ---
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
